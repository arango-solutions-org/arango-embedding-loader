name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra hosted
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not integration and not local"

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra hosted
      # Started by hand rather than as a service container: the vector index needs
      # --experimental-vector-index, and service containers cannot take a command.
      - name: Start ArangoDB
        run: |
          docker run -d --name arangodb -p 8530:8529 -e ARANGO_ROOT_PASSWORD=test arangodb:3.12 \
            arangod --server.endpoint tcp://0.0.0.0:8529 --experimental-vector-index
          until curl -sf -u root:test http://127.0.0.1:8530/_api/version; do sleep 2; done
      - run: uv run pytest -m integration
        env:
          ARANGO_TEST_ENDPOINT: http://127.0.0.1:8530
          ARANGO_TEST_PASSWORD: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: [backend, integration, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default: local + hosted providers; local models download on first use.
          - variant: default
            suffix: ""
            extras: local,hosted
            bake_models: ""
          # PubMedBERT baked in, for deployments that cannot reach the Hugging Face Hub.
          - variant: pubmedbert
            suffix: "-pubmedbert"
            extras: local,hosted
            bake_models: NeuML/pubmedbert-base-embeddings
          # Hosted providers only: no torch, no local models.
          - variant: slim
            suffix: "-slim"
            extras: hosted
            bake_models: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable={{is_not_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ael-ci:${{ matrix.variant }}
          build-args: |
            EXTRAS=${{ matrix.extras }}
            BAKE_MODELS=${{ matrix.bake_models }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test (app imports, no network)
        run: docker run --rm --network none ael-ci:${{ matrix.variant }} python -c "import app.main; print('ok')"
      - name: Offline embedding smoke test
        if: matrix.bake_models != ''
        run: |
          docker run --rm --network none ael-ci:${{ matrix.variant }} python -c "
          import asyncio
          from app.providers.registry import get_provider
          from app.providers.sentence_transformers_provider import baked_model_path
          p = get_provider('sentence_transformers')
          for m in '${{ matrix.bake_models }}'.split(','):
              assert baked_model_path(m), 'model not baked: ' + m
              v = asyncio.run(p.embed(['offline smoke test'], model=m, options=p.parse_options(None)))
              assert v and v[0], 'empty embedding: ' + m
              print('ok', m, len(v[0]), 'dims with no network')"
      - name: Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EXTRAS=${{ matrix.extras }}
            BAKE_MODELS=${{ matrix.bake_models }}
          cache-from: type=gha,scope=${{ matrix.variant }}
