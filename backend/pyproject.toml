[project]
name = "arango-embedding-loader"
version = "0.0.6"
description = "Load JSON/JSONL/CSV documents into ArangoDB with embeddings generated by a pluggable provider."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-arango>=8.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "ijson>=3.3",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
openai = ["openai>=1.50", "tiktoken>=0.7"]
voyage = ["voyageai>=0.3"]
cohere = ["cohere>=5.11"]
bedrock = ["boto3>=1.35"]
local = ["sentence-transformers>=3.2", "torch>=2.4"]
hosted = ["openai>=1.50", "tiktoken>=0.7", "voyageai>=0.3", "cohere>=5.11", "boto3>=1.35"]
all = [
    "openai>=1.50",
    "tiktoken>=0.7",
    "voyageai>=0.3",
    "cohere>=5.11",
    "boto3>=1.35",
    "sentence-transformers>=3.2",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
]

# CPU-only PyTorch wheels on Linux (Docker image); macOS/Windows use PyPI (MPS / CPU).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM105"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a running ArangoDB (docker compose up -d arangodb)",
    "local: requires the 'local' extra (sentence-transformers) and model download",
]
addopts = "-m 'not integration'"
